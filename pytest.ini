[pytest]
# Opzioni generali
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = --tb=short -v

# Ignora file/cartelle specifiche
norecursedirs = __pycache__ .git htmlcov .venv

# Markers
markers =
    slow: test lento
    integration: test di integrazione
    unit: test unitario
